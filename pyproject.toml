[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eyestrainer"
version = "0.5.1"
description = "FPS dynamic vision and reaction trainer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pygame-ce>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
build = [
    "nuitka>=4.3",
    "zstandard>=0.25",
]

[project.scripts]
eyestrainer = "eyestrainer.app:main"

[tool.setuptools.packages.find]
include = ["eyestrainer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
